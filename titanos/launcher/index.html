<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, initial-scale=1" />
    <title>Launcher</title>
    <style>html { background: #10141c; }</style>
    <!-- Classic script, runs before anything else on every engine: shims
         for APIs this Blink build may lack, plus an on-device error
         surface so a failed boot is visible on the TV, not just blank. -->
    <script>
      window.globalThis = window.globalThis || window;
      if (!Promise.prototype.finally) {
        Promise.prototype.finally = function (f) {
          var C = this.constructor || Promise;
          var run = function () { return C.resolve(typeof f === 'function' && f()); };
          return this.then(function (v) { return run().then(function () { return v; }); },
            function (e) { return run().then(function () { throw e; }); });
        };
      }
      if (!String.prototype.replaceAll) {
        String.prototype.replaceAll = function (s, r) {
          return this.split(s).join(typeof r === 'string' ? r : '');
        };
      }
      if (!window.ResizeObserver) {
        window.ResizeObserver = function () {
          this.observe = function () {}; this.unobserve = function () {}; this.disconnect = function () {};
        };
      }
      var show = function (msg) {
        var d = document.getElementById('launch-debug');
        if (!d) {
          d = document.createElement('div');
          d.id = 'launch-debug';
          d.style.cssText = 'position:fixed;left:8px;bottom:8px;right:8px;z-index:999;' +
            'background:rgba(150,30,30,.92);color:#fff;font:12px monospace;' +
            'padding:6px 10px;border-radius:4px;white-space:pre-wrap';
          (document.body || document.documentElement).appendChild(d);
        }
        d.textContent = 'launch-debug: ' + msg;
      };
      window.addEventListener('error', function (e) {
        show((e.message || e.type) + (e.lineno ? ' @ :' + e.lineno + ':' + e.colno : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        show('unhandled: ' + ((r && (r.message || r)) || 'rejection'));
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
